name: ServUO CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servuo-production
  cancel-in-progress: false

jobs:
  # 1. Стейдж проверки изменений (определяет, нужно ли компилировать ядро и рестартить сервер)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check modified files
        id: filter
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "pull_request" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Сборка и рестарт включены для типа события: ${{ github.event_name }}"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "FORCE_BUILD")
          echo "Измененные файлы:"
          echo "$CHANGED_FILES"

          # Ищем любые файлы, КРОМЕ данных/конфигов (xml, cfg, txt, md, json)
          NON_DATA_FILES=$(echo "$CHANGED_FILES" | grep -Ev '\.(xml|cfg|txt|md|json)$' || true)

          if [[ -n "$NON_DATA_FILES" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Обнаружены изменения в коде/проекте — потребуется компиляция и рестарт."
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Изменены только xml/cfg/текстовые файлы — деплой пройдет без сборки и рестарта."
          fi

  # 2. Стейдж компиляции ядра и скриптов (запускается ТОЛЬКО если менялся код)
  build:
    name: Build ServUO core & scripts
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ServUO.sln

      - name: Build Release
        run: dotnet build ServUO.sln --configuration Release --no-restore

      - name: Package compiled binaries
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          bins="$RUNNER_TEMP/servuo-binaries"
          mkdir -p "$bins"

          required=(ServUO.exe Scripts.dll Settings.dll Server.dll)
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required build output is missing or empty: $file" >&2
              exit 1
            fi
          done

          find . -maxdepth 1 -type f \( -name '*.dll' -o -name '*.exe' \) \
            -exec cp -f {} "$bins/" \;
          tar -czf "$RUNNER_TEMP/servuo-binaries.tar.gz" -C "$bins" .

      - name: Upload compiled binaries
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: servuo-binaries
          path: ${{ runner.temp }}/servuo-binaries.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 3. Стейдж деплоя (всегда загружает файлы на сервер, рестарт вынесен в отдельный шаг с условием)
  deploy:
    name: Deploy production
    needs: [changes, build]
    # Запускается всегда, даже если build был пропущен (skipped)
    if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download compiled binaries (if built)
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: servuo-binaries
          path: ${{ runner.temp }}/servuo-binaries

      - name: Assemble release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/servuo-release"
          mkdir -p "$release"

          # Упаковываем актуальные файлы из репозитория (включая xml, cfg, Data и т.д.)
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$release"

          # Если ядро пересобиралось — добавляем скомпилированные .dll и .exe в архив
          if [[ "${{ needs.changes.outputs.code_changed }}" == "true" ]]; then
            tar -xzf "$RUNNER_TEMP/servuo-binaries/servuo-binaries.tar.gz" -C "$release"
            echo "В архив добавлены новые скомпилированные файлы ядра."
          else
            echo "В архив упакованы только файлы репозитория (без бинарников)."
          fi

          tar -czf "$RUNNER_TEMP/servuo-release.tar.gz" -C "$release" .

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing production secret DEPLOY_KNOWN_HOSTS"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Transfer and unpack files to server
        id: upload_files
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/servuo-release.tar.gz
          DEPLOY_HOST: kishinskiy.ru
          DEPLOY_USER: servuo
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$RELEASE_ARCHIVE" || { echo "Release archive is missing"; exit 1; }

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_tmp="/home/servuo/tmp/servuo-deploy"

          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "mkdir -p '$remote_tmp'"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RELEASE_ARCHIVE" "$target:$remote_tmp/${RELEASE_SHA}.tar.gz"

          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "bash -s -- '$remote_tmp' '$RELEASE_SHA'" <<'EOF'
          set -Eeuo pipefail
          remote_tmp="$1"
          release_sha="$2"

          mkdir -p /home/servuo/ServUO
          tar -xzf "${remote_tmp}/${release_sha}.tar.gz" -C /home/servuo/ServUO
          rm -f "${remote_tmp}/${release_sha}.tar.gz"
          echo "Файлы успешно распакованы в /home/servuo/ServUO"
          EOF

      # Отдельный шаг/стейдж перезапуска: срабатывает ТОЛЬКО если скомпилированы и загружены новые файлы ядра
      - name: Restart ServUO server
        if: needs.changes.outputs.code_changed == 'true' && needs.build.result == 'success' && steps.upload_files.outcome == 'success'
        env:
          DEPLOY_HOST: kishinskiy.ru
          DEPLOY_USER: servuo
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "sudo systemctl restart servuo && sudo systemctl is-active --quiet servuo"
          echo "Служба servuo успешно перезапущена с новым билдом."
