name: ServUO CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servuo-production
  cancel-in-progress: false

jobs:
  build:
    name: Build ServUO
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ServUO.sln 

      - name: Build Release
        run: dotnet build ServUO.sln --configuration Release --no-restore 

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Prepare release files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/servuo-release"
          mkdir -p "$release"

          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$release"

          required=(ServUO.exe Scripts.dll Settings.dll Server.dll)
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required build output is missing or empty: $file" >&2
              exit 1
            fi
          done

          find . -maxdepth 1 -type f \( -name '*.dll' -o -name '*.exe' \) \
            -exec cp -f {} "$release/" \;
          tar -czf "$RUNNER_TEMP/servuo-release.tar.gz" -C "$release" .

      - name: Upload release files
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: servuo-release
          path: ${{ runner.temp }}/servuo-release.tar.gz
          if-no-files-found: error
          retention-days: 7
  
    

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: servuo-release
          path: ${{ runner.temp }}/servuo-release

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing production secret DEPLOY_KNOWN_HOSTS"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Backup Current ServUO
        env:
          DEPLOY_HOST: kishinskiy.ru
          DEPLOY_USER: servuo
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          DATESTAMP=$(date +%Y-%m-%d)
          SHORT_SHA="${SHORT_SHA:0:7}"
          BACKUP_NAME="servuo-${DATESTAMP}_run-${RUN_NUMBER}-${RUN_ATTEMPT}_${SHORT_SHA}.tar.gz"

          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '$BACKUP_NAME'" <<'EOF'
          set -Eeuo pipefail
          backup_name="$1"
          mkdir -p /home/servuo/BackUP
          if [ -d /home/servuo/ServUO ] && [ -n "$(ls -A /home/servuo/ServUO)" ]; then
            tar -czf "/home/servuo/BackUP/${backup_name}" -C /home/servuo ServUO
            echo "Создан бэкап: /home/servuo/BackUP/${backup_name}"
          else
            echo "Папка /home/servuo/ServUO еще не существует или пуста — бэкап пропущен."
          fi
          EOF
      
      
      - name: Transfer and activate release
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/servuo-release/servuo-release.tar.gz
          DEPLOY_HOST: kishinskiy.ru
          DEPLOY_USER: servuo
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$RELEASE_ARCHIVE" || { echo "Full server release archive is missing"; exit 1; }

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_tmp="/home/servuo/tmp/servuo-deploy"

          # Создаем временную папку и загружаем архив
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "mkdir -p '$remote_tmp'"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RELEASE_ARCHIVE" "$target:$remote_tmp/${RELEASE_SHA}.tar.gz"

          # Останавливаем сервер, распаковываем релиз, запускаем обратно и чистим мусор
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "bash -s -- '$remote_tmp' '$RELEASE_SHA'" <<'EOF'
          set -Eeuo pipefail
          remote_tmp="$1"
          release_sha="$2"
          # sudo systemctl stop servuo
          mkdir -p /home/servuo/ServUO
          tar -xzf "${remote_tmp}/${release_sha}.tar.gz" -C /home/servuo/ServUO
          rm -f "${remote_tmp}/${release_sha}.tar.gz"
          # sudo systemctl start servuo
          EOF
      