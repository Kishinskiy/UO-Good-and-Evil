name: ServUO CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servuo-production
  cancel-in-progress: false

jobs:
  build:
    name: Build ServUO
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ServUO.sln

      - name: Build Release
        run: dotnet build ServUO.sln --configuration Release --no-restore

      - name: Prepare release files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          release="$RUNNER_TEMP/servuo-release"
          mkdir -p "$release"

          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$release"

          required=(ServUO.exe Scripts.dll Settings.dll Server.dll)
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required build output is missing or empty: $file" >&2
              exit 1
            fi
          done

          find . -maxdepth 1 -type f \( -name '*.dll' -o -name '*.exe' \) \
            -exec cp -f {} "$release/" \;
          tar -czf "$RUNNER_TEMP/servuo-release.tar.gz" -C "$release" .

      - name: Upload release files
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: servuo-release
          path: ${{ runner.temp }}/servuo-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Check if server restart is required
        id: check_restart
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "Ручной запуск (workflow_dispatch) — перезапуск включен."
            exit 0
          fi

          # Получаем список измененных файлов между предыдущим и текущим коммитом
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "FORCE_RESTART")
          echo "Измененные файлы:"
          echo "$CHANGED_FILES"

          # Ищем файлы, НЕ относящиеся к xml, cfg, txt, md, json
          NON_DATA_FILES=$(echo "$CHANGED_FILES" | grep -Ev '\.(xml|cfg|txt|md|json)$' || true)

          if [[ -n "$NON_DATA_FILES" ]]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "Обнаружены изменения в коде/сборке — требуется перезапуск сервера."
          else
            echo "restart=false" >> "$GITHUB_OUTPUT"
            echo "Изменены только файлы данных (xml/cfg/txt/md/json) — перезапуск НЕ требуется."
          fi

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: servuo-release
          path: ${{ runner.temp }}/servuo-release

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing production secret DEPLOY_KNOWN_HOSTS"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Transfer and activate release
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/servuo-release/servuo-release.tar.gz
          DEPLOY_HOST: kishinskiy.ru
          DEPLOY_USER: servuo
          RELEASE_SHA: ${{ github.sha }}
          NEED_RESTART: ${{ steps.check_restart.outputs.restart }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$RELEASE_ARCHIVE" || { echo "Full server release archive is missing"; exit 1; }

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_tmp="/home/servuo/tmp/servuo-deploy"

          # Создаем временную папку и загружаем архив
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "mkdir -p '$remote_tmp'"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RELEASE_ARCHIVE" "$target:$remote_tmp/${RELEASE_SHA}.tar.gz"

          # Распаковываем релиз и перезапускаем службу только если NEED_RESTART=true
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "bash -s -- '$remote_tmp' '$RELEASE_SHA' '$NEED_RESTART'" <<'EOF'
          set -Eeuo pipefail
          remote_tmp="$1"
          release_sha="$2"
          need_restart="$3"

          if [[ "$need_restart" == "true" ]]; then
            echo "Останавливаем службу servuo..."
            sudo systemctl stop servuo
          else
            echo "Обновление без остановки сервера (hot-reload данных)..."
          fi

          mkdir -p /home/servuo/ServUO
          tar -xzf "${remote_tmp}/${release_sha}.tar.gz" -C /home/servuo/ServUO
          rm -f "${remote_tmp}/${release_sha}.tar.gz"

          if [[ "$need_restart" == "true" ]]; then
            echo "Запускаем службу servuo..."
            sudo systemctl start servuo
          fi
          EOF
