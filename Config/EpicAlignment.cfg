# Настройки вознесения (Epic Alignment)
# Прибавка к общему лимиту статов (вместо жесткого 330 теперь +105 к текущему капе игрока)
StatCapBonus=105

# Мгновенный прирост к каждой характеристике (Str, Dex, Int) при вознесении
StatInstantBonus=25

# Максимальный индивидуальный лимит одного стата (берется как минимум, если у игрока не выше)
MinIndividualStatCap=150

# Прибавка к общему лимиту скиллов (1000 = +100.0 к текущему капе игрока)
TotalSkillCapBonus=1000

# Прибавка к лимиту профильных навыков (30.0 к текущему капе навыка, например 100 -> 130, 120 -> 150)
EpicSkillCapBonus=50.0

# Требуемая карма (+5000 для Света, -5000 для Тьмы)
RequiredKarma=5000
